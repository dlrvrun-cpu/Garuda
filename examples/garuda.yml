# Copy to .github/workflows/garuda.yml in your Salesforce repo, and add an ANTHROPIC_API_KEY secret.
name: Garuda

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write        # learn: commit to .garuda/memory on the PR branch
  pull-requests: write   # review: post comments

jobs:
  permit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: dlrvrun-cpu/garuda@main
        with:
          mode: permit

  review:
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dlrvrun-cpu/garuda@main
        with:
          mode: review
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

  learn:
    if: github.event_name == 'pull_request_review_comment' && startsWith(github.event.comment.body, '/garuda dismiss')
    runs-on: ubuntu-latest
    steps:
      - uses: dlrvrun-cpu/garuda@main
        with:
          mode: learn
